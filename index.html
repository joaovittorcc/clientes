<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="mainnav">
    <span class="brand">Evodev · Painel</span>
    <div class="nav-links">
      <a href="index.html" class="active">Clientes</a>
      <a href="leads.html">Leads</a>
    </div>
  </nav>
  <div class="app">
    <header class="topbar">
      <h1>Clientes</h1>
      <button id="btn-novo" class="btn btn-primary">+ Novo cliente</button>
    </header>

    <section class="stats">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Clientes</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-andamento">0</span>
        <span class="stat-label">Em andamento</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-concluido">0</span>
        <span class="stat-label">Concluídos</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-pendente">R$ 0</span>
        <span class="stat-label">A receber</span>
      </div>
    </section>

    <section class="toolbar">
      <input type="text" id="busca" placeholder="Buscar por nome, empresa ou serviço..." />
      <select id="filtro-status">
        <option value="">Todos os status</option>
        <option value="andamento">Em andamento</option>
        <option value="concluido">Concluído</option>
        <option value="pausado">Pausado</option>
      </select>
    </section>

    <section class="clientes-grid" id="clientes-grid"></section>
    <p id="vazio" class="vazio" hidden>Nenhum cliente cadastrado ainda. Clique em "Novo cliente" para começar.</p>
  </div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Novo cliente</h2>
        <button id="btn-fechar" class="btn-icon" aria-label="Fechar">&times;</button>
      </div>
      <form id="form-cliente">
        <input type="hidden" id="cliente-id" />
        <div class="form-grid">
          <label class="field">
            <span>Nome *</span>
            <input type="text" id="f-nome" required />
          </label>
          <label class="field">
            <span>Empresa</span>
            <input type="text" id="f-empresa" />
          </label>
          <label class="field">
            <span>Telefone</span>
            <input type="text" id="f-telefone" placeholder="(11) 99999-9999" />
          </label>
          <label class="field">
            <span>Email</span>
            <input type="email" id="f-email" />
          </label>
          <label class="field">
            <span>Serviço</span>
            <input type="text" id="f-servico" placeholder="Ex: Site institucional" />
          </label>
          <label class="field">
            <span>Status do projeto</span>
            <select id="f-status">
              <option value="andamento">Em andamento</option>
              <option value="concluido">Concluído</option>
              <option value="pausado">Pausado</option>
            </select>
          </label>
          <label class="field">
            <span>Valor mínimo (R$)</span>
            <input type="number" id="f-valor-min" min="0" step="0.01" placeholder="0,00" />
          </label>
          <label class="field">
            <span>Valor máximo (R$)</span>
            <input type="number" id="f-valor-max" min="0" step="0.01" placeholder="0,00" />
          </label>
          <label class="field">
            <span>Valor fechado (R$)</span>
            <input type="number" id="f-valor-fechado" min="0" step="0.01" placeholder="Preencher ao fechar" />
          </label>
          <label class="field">
            <span>Pagamento</span>
            <select id="f-pagamento">
              <option value="pendente">Pendente</option>
              <option value="pago">Pago</option>
              <option value="parcial">Parcial</option>
            </select>
          </label>
          <label class="field field-full">
            <span>Link da demo</span>
            <input type="text" id="f-demo-url" placeholder="https://meuprojeto.vercel.app" />
          </label>
          <label class="field field-full">
            <span>Nota rápida</span>
            <input type="text" id="f-nota-rapida" placeholder="Lembrete curto..." />
          </label>
          <label class="field field-full">
            <span>Foto de capa</span>
            <input type="file" id="f-foto-capa" accept="image/*" />
          </label>
          <div class="field field-full">
            <span>Checklist</span>
            <div id="checklist-editor"></div>
            <div class="checklist-editor-add">
              <input type="text" id="f-checklist-novo" placeholder="Nova etapa..." />
              <button type="button" id="btn-checklist-add" class="btn btn-secondary">Adicionar</button>
            </div>
          </div>
          <label class="field field-full">
            <span>Observações</span>
            <textarea id="f-obs" rows="3" placeholder="Anotações sobre o cliente..."></textarea>
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" id="btn-excluir" class="btn btn-danger" hidden>Excluir</button>
          <div class="modal-footer-right">
            <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <input type="file" id="input-foto-capa" accept="image/*" hidden />

  <nav class="bottomnav">
    <a href="index.html" class="active">Clientes</a>
    <a href="leads.html">Leads</a>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
